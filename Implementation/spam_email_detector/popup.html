<!DOCTYPE html>
<html ng-app="SpamApp">
<head>
  <meta charset="UTF-8">
  <title>Spam Detector</title>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <script src="content.js"></script>
  <script src="background.js"></script>
</head>
<body ng-controller="SpamController">
  <h1>Spam Detector</h1>
  <textarea ng-model="emailContent" rows="10" cols="50" placeholder="Paste email content here"></textarea>
  <br>
  <button ng-click="checkSpam()">Check</button>
  <h2>{{result}}</h2>
</body>
</html>
