<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spam Detector</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="icon.png">
</head>
<body>
    <div class="container">
        <h1>Spam Email Detector</h1>
        <label for="email_text">Enter or Paste Email Content:</label>
        <textarea id="email_text" placeholder="Paste email text here..."></textarea>
        <button id="checkSpam">Check Spam</button>
        <p id="result"></p>
    </div>
    <script src="popup.js"></script>
</body>
</html>
